name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
    - name: Trigger Render Deployment
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets['RENDER_DEPLOY_HOOK_URL'] }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
          echo "RENDER_DEPLOY_HOOK_URL secret is not set!"
          exit 1
        fi
        curl -X POST -d "" "$RENDER_DEPLOY_HOOK_URL"

    - name: Wait for Deployment
      run: |
        echo "Waiting 60 seconds for deployment to initialize..."
        sleep 60

    - name: Health Check Validation
      env:
        PRODUCTION_API_URL: ${{ vars['PRODUCTION_API_URL'] }}
      run: |
        if [ -z "$PRODUCTION_API_URL" ]; then
          echo "PRODUCTION_API_URL variable is not set! Skipping health check."
          exit 0
        fi
        echo "Running post-deployment health check against $PRODUCTION_API_URL..."
        
        # Test /health endpoint with timeout and retries
        MAX_RETRIES=10
        RETRY_INTERVAL=15
        
        for i in $(seq 1 $MAX_RETRIES); do
          echo "Health check attempt $i of $MAX_RETRIES..."
          response=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "$PRODUCTION_API_URL/health" || echo "000")
          if [ "$response" -eq 200 ]; then
            echo "Health check passed!"
            
            # Test /system/status endpoint
            sys_response=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "$PRODUCTION_API_URL/system/status" || echo "000")
            if [ "$sys_response" -eq 200 ]; then
              echo "Post-deployment validation successful!"
              exit 0
            else
              echo "Deployment failed! System status check returned $sys_response"
              exit 1
            fi
          fi
          echo "Health check returned $response. Retrying in $RETRY_INTERVAL seconds..."
          sleep $RETRY_INTERVAL
        done
        
        echo "Deployment failed! Health check did not succeed within time limit."
        exit 1
