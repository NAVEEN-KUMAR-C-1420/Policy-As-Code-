name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile check
      run: |
        python -m compileall .

    - name: API Testing
      env:
        DATABASE_PROVIDER: sqlite
        GROQ_API_KEY: "dummy_key_for_tests"
        TAVILY_API_KEY: "dummy_key_for_tests"
      run: |
        python -m pytest api_testing/ -v --junitxml=test-results/api-test-results.xml

    - name: Governance Testing
      env:
        DATABASE_PROVIDER: sqlite
        GROQ_API_KEY: "dummy_key_for_tests"
      run: |
        python test_governance.py

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
