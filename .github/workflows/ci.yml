name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PYTHONPATH: backend
  DATABASE_PROVIDER: sqlite
  GROQ_API_KEY: ci_dummy_key_not_real
  OPENAI_API_KEY: ci_dummy_key_not_real
  ANTHROPIC_API_KEY: ci_dummy_key_not_real
  TAVILY_API_KEY: ci_dummy_key_not_real
  LANGCHAIN_TRACING_V2: "false"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ───────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ All dependencies installed successfully."

      # ── 4. Validate environment ───────────────────────────────
      - name: Validate environment
        working-directory: backend
        run: |
          python -c "
          import sys
          print(f'Python: {sys.version}')
          print(f'PYTHONPATH includes backend: {\"backend\" in sys.path or \".\" in sys.path}')

          # Verify critical imports resolve
          try:
              from core.paths import BASE_DIR
              print(f'✅ core.paths.BASE_DIR = {BASE_DIR}')
          except ImportError as e:
              print(f'❌ core.paths import failed: {e}')
              sys.exit(1)

          try:
              from common.db import PROVIDER
              print(f'✅ DATABASE_PROVIDER = {PROVIDER}')
          except ImportError as e:
              print(f'❌ common.db import failed: {e}')
              sys.exit(1)

          try:
              from api.main import app
              print(f'✅ FastAPI app loaded: {app.title}')
          except Exception as e:
              print(f'❌ FastAPI app import failed: {e}')
              sys.exit(1)

          print('✅ Environment validation passed.')
          "

      # ── 5. Verify project structure ───────────────────────────
      - name: Verify project structure
        working-directory: backend
        run: |
          python -c "
          from pathlib import Path
          import sys

          errors = []
          base = Path('.')

          # Required directories
          for d in ['agents', 'api', 'common', 'config', 'core', 'data',
                    'middleware', 'orchestrator', 'scripts', 'tests']:
              if not (base / d).is_dir():
                  errors.append(f'Missing directory: {d}/')

          # Required files
          for f in ['requirements.txt', 'pyproject.toml', '.env.example',
                    'config/providers.yaml', 'core/paths.py', 'core/__init__.py']:
              if not (base / f).is_file():
                  errors.append(f'Missing file: {f}')

          # Agent structure validation
          for agent in ['data_collector_agent', 'risk_analyzer_agent', 'report_writer_agent']:
              agent_dir = base / 'agents' / agent
              if not agent_dir.is_dir():
                  errors.append(f'Missing agent directory: agents/{agent}/')
              else:
                  for required in ['agent.yaml', 'policy.yaml']:
                      if not (agent_dir / required).is_file():
                          errors.append(f'Missing: agents/{agent}/{required}')

          if errors:
              print('❌ Project structure verification FAILED:')
              for e in errors:
                  print(f'   - {e}')
              sys.exit(1)
          else:
              print('✅ Project structure verified: all directories and files present.')
          "

      # ── 6. Run linting ────────────────────────────────────────
      - name: Run linting (ruff)
        working-directory: backend
        run: |
          ruff check . --output-format=github || true
          echo "ℹ️  Lint check completed (non-blocking for initial adoption)."

      - name: Check formatting (black)
        working-directory: backend
        run: |
          black --check --diff . 2>&1 || true
          echo "ℹ️  Format check completed (non-blocking for initial adoption)."

      # ── 7. Initialize test database ───────────────────────────
      - name: Initialize test database
        working-directory: backend
        run: |
          python data/init_db.py
          echo "✅ Test database initialized."

      # ── 8. Run tests ──────────────────────────────────────────
      - name: Run all tests
        working-directory: backend
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --junitxml=tests/reports/junit.xml \
            --override-ini="pythonpath=." \
            -x \
            || exit_code=$?

          if [ "${exit_code:-0}" -ne 0 ]; then
            echo ""
            echo "❌ TEST FAILURE DIAGNOSTICS"
            echo "=========================="
            echo "Exit code: ${exit_code}"
            echo ""
            echo "Common fixes:"
            echo "  - Import error: Check PYTHONPATH is set to 'backend'"
            echo "  - DB error: Ensure DATABASE_PROVIDER=sqlite and init_db.py ran"
            echo "  - API key error: Tests should not require real API keys"
            echo ""
            exit ${exit_code}
          fi

          echo "✅ All tests passed."

      # ── 9. Run verification framework ─────────────────────────
      - name: Run CI verification framework
        working-directory: backend
        run: |
          python scripts/verify_project.py
          echo "✅ Verification framework passed."

      # ── 10. Upload reports ────────────────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/tests/reports/
          retention-days: 30
          if-no-files-found: warn
