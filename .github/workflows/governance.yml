name: Governance Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Governance Validation
        # governance_validator.py resolves all paths relative to itself,
        # so working-directory must be backend/ (same as local dev invocation).
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          GROQ_API_KEY: dummy
          OPENAI_API_KEY: dummy
          DATABASE_PROVIDER: sqlite
        run: python scripts/governance_validator.py

      - name: Upload Governance Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-report
          path: backend/manifest.json
          retention-days: 30
