agent_id: report_writer_agent
allowed_tools:
- allowed: true
  contains_pii: false
  name: save_report_to_db
  resource: sqlite
  scope: write
  tables:
  - reports
- allowed: true
  contains_pii: false
  name: write_report_file
  resource: filesystem
  scope: write
  tables: []
- allowed: false
  contains_pii: false
  name: delete_old_reports
  resource: sqlite
  scope: delete
  tables:
  - reports
approved_models:
- openai/gpt-oss-120b
- gpt-4o-mini
- claude-3-5-sonnet-20241022
audit:
  enabled: true
  log_denied_actions: true
  log_inputs: true
  log_outputs: true
data_access:
  allowed_tables:
  - reports
  pii_allowed: false
data_retention:
  audit_logs_days: 365
  reports_days: 90
denied_scopes:
- delete
guardrails:
  harmful_content_filter: true
  pii_protection: true
  prompt_injection_protection: true
hitl:
  enabled: false
  high_risk_requires_approval: false
  risk_threshold: 0.7
policy_version: '1.0'
rate_limits:
  max_calls_per_tool: 5
regulatory_frameworks:
- internal-financial-governance
