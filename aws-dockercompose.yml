version: "3.8"

services:
  backend:
    image: pradeepmk17/aivar-backend:latest
    container_name: aivar-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_PROVIDER: sqlite
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      ENVIRONMENT: production
    restart: unless-stopped
    networks:
      - aivar-network

  frontend:
    image: pradeepmk17/aivar-frontend:latest
    container_name: aivar-frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aivar-network

networks:
  aivar-network:
    driver: bridge