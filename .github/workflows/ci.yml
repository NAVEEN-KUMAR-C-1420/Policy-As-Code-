name: CI Pipeline

on:
  push:
    branches:
      - main
      - staging
      - dev
      - develop
  pull_request:
    branches:
      - main
      - staging
      - dev
      - develop

env:
  PYTHONPATH: ${{ github.workspace }}/backend
  DATABASE_PROVIDER: sqlite
  GROQ_API_KEY: ci_dummy_key_not_real
  OPENAI_API_KEY: ci_dummy_key_not_real
  ANTHROPIC_API_KEY: ci_dummy_key_not_real
  TAVILY_API_KEY: ci_dummy_key_not_real
  DOCKER_HUB_USERNAME: pradeepmk17

jobs:
  build-test-validate:
    name: Build, Test & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend static bundle
        working-directory: frontend
        run: npm run build

      - name: Initialize test database
        working-directory: backend
        run: python data/init_db.py

      - name: Run unit & API test suite
        working-directory: backend
        run: python tests/run_all_tests.py

      - name: Run Governance Validation & Generate Manifest
        working-directory: backend
        run: python scripts/governance_validator.py

      # Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u pradeepmk17 --password-stdin

      # Build Backend Image
      - name: Build Backend Docker Image
        run: |
          docker build \
            -t pradeepmk17/aivar-backend:latest \
            -t pradeepmk17/aivar-backend:${{ github.sha }} \
            ./backend

      # Push Backend Image
      - name: Push Backend Docker Image
        if: github.event_name == 'push'
        run: |
          docker push pradeepmk17/aivar-backend:latest
          docker push pradeepmk17/aivar-backend:${{ github.sha }}

      # Build Frontend Image
      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t pradeepmk17/aivar-frontend:latest \
            -t pradeepmk17/aivar-frontend:${{ github.sha }} \
            ./frontend

      # Push Frontend Image
      - name: Push Frontend Docker Image
        if: github.event_name == 'push'
        run: |
          docker push pradeepmk17/aivar-frontend:latest
          docker push pradeepmk17/aivar-frontend:${{ github.sha }}

      - name: Upload Build & Governance Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-build-artifacts
          path: |
            backend/tests/reports/
            backend/manifest.json
          retention-days: 30