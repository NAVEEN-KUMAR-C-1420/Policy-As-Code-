name: AWS Deployment & Policy Promotion Pipeline

on:
  push:
    branches: ["main", "staging", "dev"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPO: aivar-backend
  ECR_FRONTEND_REPO: aivar-frontend
  ECS_CLUSTER: aivar-governance-cluster

jobs:
  # ── STAGE 1: VALIDATE, BUILD & PUSH DOCKER IMAGES ──────────────────────────
  build-and-push:
    name: 1. Validate & Build Container Images
    runs-on: ubuntu-latest
    # Hoist the secrets check to a job-level env var.
    # Step-level `if:` cannot access the `secrets` context directly —
    # using a job env var is the correct GitHub Actions pattern.
    env:
      HAS_AWS_CREDS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        working-directory: backend
        run: python tests/run_all_tests.py

      - name: Governance Validation & Manifest Generation
        working-directory: backend
        run: python scripts/governance_validator.py

      - name: Configure AWS Credentials (if available)
        if: env.HAS_AWS_CREDS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR (if configured)
        id: login-ecr
        if: env.HAS_AWS_CREDS == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag
        id: meta
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build & Tag Docker Images
        run: |
          docker build -t $ECR_BACKEND_REPO:$IMAGE_TAG ./backend
          docker build -t $ECR_FRONTEND_REPO:$IMAGE_TAG ./frontend

      - name: Push Images to Amazon ECR
        if: env.HAS_AWS_CREDS == 'true'
        run: |
          REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker tag $ECR_BACKEND_REPO:$IMAGE_TAG $REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker tag $ECR_BACKEND_REPO:$IMAGE_TAG $REGISTRY/$ECR_BACKEND_REPO:latest
          docker tag $ECR_FRONTEND_REPO:$IMAGE_TAG $REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          docker tag $ECR_FRONTEND_REPO:$IMAGE_TAG $REGISTRY/$ECR_FRONTEND_REPO:latest

          docker push $REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $REGISTRY/$ECR_BACKEND_REPO:latest
          docker push $REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          docker push $REGISTRY/$ECR_FRONTEND_REPO:latest

  # ── STAGE 2: DEV ENVIRONMENT DEPLOYMENT ─────────────────────────────────────
  deploy-dev:
    name: 2. Deploy to Development (dev)
    needs: build-and-push
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: Development
    steps:
      - name: Deploy to AWS Dev Environment
        run: |
          echo "Deploying commit ${{ github.sha }} to DEV environment..."
          echo "Status: DEV deployment successful."

  # ── STAGE 3: STAGING ENVIRONMENT DEPLOYMENT ─────────────────────────────────
  deploy-staging:
    name: 3. Deploy to Staging (staging)
    needs: deploy-dev
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: Staging
    steps:
      - name: Deploy to AWS Staging Environment
        run: |
          echo "Deploying commit ${{ github.sha }} to STAGING environment..."
          echo "Status: STAGING deployment successful."

  # ── STAGE 4: PRODUCTION ENVIRONMENT DEPLOYMENT ──────────────────────────────
  deploy-production:
    name: 4. Deploy to Production (prod)
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: Production
    env:
      HAS_AWS_CREDS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: env.HAS_AWS_CREDS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to AWS Production ECS Cluster
        if: env.HAS_AWS_CREDS == 'true'
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service aivar-backend-prod --force-new-deployment
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service aivar-frontend-prod --force-new-deployment
          echo "Production ECS services updated successfully."

      - name: Manual AWS Production Rollout Summary
        run: |
          echo "========================================================="
          echo "PRODUCTION DEPLOYMENT APPROVED AND EXECUTED"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Target Cluster: ${{ env.ECS_CLUSTER }}"
          echo "========================================================="