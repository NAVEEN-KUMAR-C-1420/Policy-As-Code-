name: Security Scans

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed .env files
        run: |
          FOUND_ENV=false
          if [ -f ".env" ]; then
            echo "❌ SECURITY BREACH: .env file found at repository root!"
            FOUND_ENV=true
          fi
          if [ -f "backend/.env" ]; then
            echo "❌ SECURITY BREACH: backend/.env file found in repository!"
            FOUND_ENV=true
          fi
          TRACKED=$(git ls-files '*.env' ':!:*.env.example' ':!:.trufflehog.yml' 2>/dev/null || true)
          if [ -n "$TRACKED" ]; then
            echo "❌ SECURITY BREACH: .env files are tracked by git:"
            echo "$TRACKED"
            FOUND_ENV=true
          fi
          if [ "$FOUND_ENV" = true ]; then
            echo ""
            echo "HOW TO FIX:"
            echo "  1. Remove the .env file from tracking: git rm --cached .env"
            echo "  2. Add .env to .gitignore (should already be there)"
            echo "  3. Rotate any exposed credentials immediately"
            exit 1
          fi
          echo "✅ No .env files committed. Repository is clean."

      - name: TruffleHog Secret Scan (PR)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified --exclude-paths=.trufflehog.yml

      - name: TruffleHog Secret Scan (push/schedule)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          path: ./
          extra_args: --only-verified --exclude-paths=.trufflehog.yml